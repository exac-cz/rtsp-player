<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RTSP Player</title>
    <!-- No <base>: with hash routing it would drop index.html from file:// URLs and break reloads -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
