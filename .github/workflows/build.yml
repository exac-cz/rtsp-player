# Pull requests: lint + build all installers (required checks before merging).
# Pushes to master (= merged pull requests): the same, then publish the installers as the
# rolling "Nightly" pre-release, replacing the previous nightly build.
name: Build

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels a build that is still running.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        # Nightly builds get e.g. 1.0.0-nightly.20261022.g18b3086 (date + commit);
        # pull request builds keep the package.json version.
        if: github.event_name != 'pull_request'
        run: |
          base=$(node -p "require('./package.json').version")
          echo "version=${base}-nightly.$(date -u +%Y%m%d).g${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish-nightly:
    name: Publish nightly pre-release
    needs: [version, package]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Give the installers fixed names
        # Fixed names keep the download links stable from one nightly to the next.
        run: |
          mkdir upload
          cp artifacts/rtsp-player-windows-x64/*.exe upload/RTSP-Player-nightly-windows-x64.exe
          cp artifacts/rtsp-player-macos-arm64/*.dmg upload/RTSP-Player-nightly-macos-arm64.dmg
          cp artifacts/rtsp-player-macos-x64/*.dmg upload/RTSP-Player-nightly-macos-x64.dmg
          ls -l upload
      - name: Replace the Nightly pre-release
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly upload/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build ($VERSION)" \
            --notes "Automatic build of \`master\` at ${GITHUB_SHA::7}, version \`$VERSION\`. Not a release: use for testing. These installers are not code-signed (see README)."
